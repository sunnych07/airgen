<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900"><defs><linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0B132B"/><stop offset="100%" stop-color="#1C2541"/></linearGradient></defs><rect width="1440" height="900" fill="url(#bgGrad)"/><g transform="translate(200, 100)"><rect width="1040" height="700" rx="16" fill="#091830" stroke="#1E3A8A"/><text x="50" y="70" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Terms &amp; Conditions</text><text x="50" y="100" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Last Updated: September 2026</text><g transform="translate(50, 150)"><text x="0" y="0" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">1. Acceptance of Terms</text><text x="0" y="25" font-family="Inter, sans-serif" font-size="14" fill="#E2E8F0" width="900">By accessing and registering with AirGen Aviation, you accept and agree to be bound by the terms and provision of this agreement.</text><text x="0" y="70" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">2. DGCA Training Compliance</text><text x="0" y="95" font-family="Inter, sans-serif" font-size="14" fill="#E2E8F0">All ground classes and flight training are conducted strictly in accordance with the Directorate General of Civil Aviation (DGCA) India regulations.</text><text x="0" y="140" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">3. Fee Structure &amp; Refunds</text><text x="0" y="165" font-family="Inter, sans-serif" font-size="14" fill="#E2E8F0">Training fees are subject to current fuel prices and currency exchange rates for international bases (USA &amp; RSA). Refunds are processed as per our standard policy.</text><text x="0" y="210" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">4. Privacy Policy (OTP &amp; Data)</text><text x="0" y="235" font-family="Inter, sans-serif" font-size="14" fill="#E2E8F0">Your phone number and email address are used strictly for authentication (OTP) and communication regarding your flight training schedule.</text></g><g transform="translate(420, 600)"><rect width="200" height="50" rx="8" fill="#FBBF24"/><text x="100" y="30" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle">I Agree &amp; Close</text></g></g></svg>
