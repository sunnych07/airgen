  <!-- RIGHT COLUMN: Parents FAQ Accordion & Accreditations -->
  <g transform="translate(700, 215)" filter="url(#shadow6)">
    <rect width="660" height="490" rx="20" fill="#0B1E3B" stroke="#1E3A8A" stroke-width="1.5" />
    
    <g transform="translate(32, 28)">
      <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Frequently Asked Questions by Parents</text>
      <text x="0" y="22" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8">Clear, honest answers to safeguard your child’s career investment.</text>

      <!-- FAQ 1 (Expanded) -->
      <g transform="translate(0, 45)">
        <rect width="596" height="100" rx="10" fill="#08172D" stroke="#38BDF8" stroke-width="1.5" />
        <text x="18" y="26" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#38BDF8">Q: Is my child safe while flying abroad in Phoenix or South Africa?</text>
        <text x="18" y="52" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#CBD5E1">
          <tspan x="18" dy="0">Yes. All AirGen cadets stay in secured, gated pilot residences with 24/7 wardens,</tspan>
          <tspan x="18" dy="18">supervised flight line shuttles, and dedicated AirGen batch managers on ground.</tspan>
        </text>
      </g>

      <!-- FAQ 2 -->
      <g transform="translate(0, 160)">
        <rect width="596" height="68" rx="10" fill="#08172D" stroke="#1E3A8A" />
        <text x="18" y="26" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Q: Can we avail an education loan for the entire course?</text>
        <text x="18" y="48" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">
          Yes. AirGen provides full documentation for SBI Scholar &amp; HDFC Credila pilot loan schemes.
        </text>
      </g>

      <!-- FAQ 3 -->
      <g transform="translate(0, 243)">
        <rect width="596" height="68" rx="10" fill="#08172D" stroke="#1E3A8A" />
        <text x="18" y="26" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Q: What happens if DGCA regulations change during training?</text>
        <text x="18" y="48" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">
          AirGen’s curriculum is synchronized in real-time with DGCA CAR Section 7 requirements.
        </text>
      </g>

      <!-- Regulatory Accreditations Box -->
      <g transform="translate(0, 330)">
        <rect width="596" height="85" rx="10" fill="#08172E" stroke="#1E3A8A" />
        <text x="20" y="24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" letter-spacing="1">REGULATORY COMPLIANCE &amp; ACCREDITATIONS:</text>
        
        <g transform="translate(20, 38)" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">
          <g>
            <circle cx="6" cy="6" r="3" fill="#10B981" />
            <text x="16" y="10">DGCA India (CAR Section 7)</text>
          </g>
          <g transform="translate(190, 0)">
            <circle cx="6" cy="6" r="3" fill="#10B981" />
            <text x="16" y="10">FAA Part 141 (USA)</text>
          </g>
          <g transform="translate(340, 0)">
            <circle cx="6" cy="6" r="3" fill="#10B981" />
            <text x="16" y="10">SACAA Part 61 (S. Africa)</text>
          </g>
          <g transform="translate(485, 0)">
            <circle cx="6" cy="6" r="3" fill="#10B981" />
            <text x="16" y="10">ICAO Annex 1</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Regulatory Brand Footer -->
  <g transform="translate(80, 725)">
    <rect width="1280" height="95" rx="14" fill="#07152B" stroke="#1E3A8A" stroke-width="1" />
    
    <!-- Footer Brand -->
    <g transform="translate(24, 25)">
      <text x="0" y="18" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">AIRGEN AVIATION ACADEMY</text>
      <text x="0" y="38" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="11.5" fill="#64748B">Aviation Career Pathway &amp; DGCA Precision Ground Training Organization • 80+ Airline Pilots Graduated</text>
    </g>

    <!-- Campus Details -->
    <g transform="translate(750, 25)" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#94A3B8">
      <text x="0" y="14" font-weight="700" fill="#CBD5E1">Flight HQ:</text>
      <text x="65" y="14">Hangar 4, Begumpet / Hyderabad, India</text>
      <text x="0" y="34" font-weight="700" fill="#CBD5E1">Inquiries:</text>
      <text x="65" y="34">admissions@airgenaviation.com | +91 91234 56789</text>
    </g>

    <!-- Copyright -->
    <g transform="translate(1180, 25)">
      <text x="80" y="24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="end">© 2026 AirGen</text>
      <text x="80" y="40" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="end">All Rights Reserved</text>
    </g>
  </g>

  <!-- Slide Footer Watermark Label -->
  <g transform="translate(80, 860)">
    <text x="0" y="14" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="1.5">AIRGEN AVIATION • SCREEN 06: ADMISSIONS, PARENTAL GUIDANCE &amp; ACCREDITATIONS</text>
    <text x="1280" y="14" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="end">CONFIDENTIAL DESIGN JURY PRESENTATION</text>
  </g>
</svg>
