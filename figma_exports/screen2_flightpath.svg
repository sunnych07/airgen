      <text x="14" y="40">MCC &amp; Jet Orientation (JOC)</text>

      <circle cx="4" cy="66" r="3" fill="#38BDF8" />
      <text x="14" y="70">Airline Simulator Assessments</text>

      <circle cx="4" cy="96" r="3" fill="#38BDF8" />
